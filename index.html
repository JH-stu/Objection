<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECTION! - Simulator Pengadilan ID</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <h1>OBJECTION!</h1>
        <div id="case-title" class="case-badge">Memuat Kasus...</div>
    </header>

    <!-- PANEL 1: SIDANG & UJI SILANG (DEFAULT ACTIVE) -->
    <main id="panel-sidang" class="tab-panel active">
        <div class="card">
            <div class="card-title">📌 DAKWAAN & TERDAKWA</div>
            <p><strong>Terdakwa:</strong> <span id="def-name">-</span></p>
            <p id="case-desc" style="margin-top: 6px; font-size: 0.9rem; color: #bbb;">-</p>
        </div>

        <div class="card">
            <div class="card-title" style="color: #59a0c5;">⚡ UJI SILANG (CROSS EXAMINATION)</div>
            <div id="cross-container"></div>
        </div>

        <div class="card text-center">
            <div class="card-title">🔨 AMAR PUTUSAN MAJELIS HAKIM</div>
            <button class="btn-verdict btn-red" onclick="makeVerdict('GUILTY')">BERSALAH</button>
            <button class="btn-verdict btn-green" onclick="makeVerdict('INNOCENT')">BEBAS (VRIJSPRAAK)</button>
        </div>

        <!-- EVALUASI HUKUM (LANGSUNG MUNCUL SETELAH KETUK PALU) -->
        <div id="legal-evaluation-card" class="card" style="display: none;">
            <div class="card-title" style="color: #c5a059;">⚖️ PENILAIAN HUKUM / EVALUASI KINERJA</div>
            <div id="legal-evaluation-content"></div>
            <button class="btn-next" onclick="openNewsModal()">LIHAT REAKSI PUBLIK (KORAN) 📰</button>
        </div>
    </main>

    <!-- PANEL 2: ALAT BUKTI -->
    <main id="panel-bukti" class="tab-panel">
        <div class="card">
            <div class="card-title">🔍 BERKAS ALAT BUKTI SAH (PASAL 184 KUHAP)</div>
            <div id="evidence-container"></div>
        </div>
    </main>

    <!-- PANEL 3: PASAL / UU -->
    <main id="panel-uu" class="tab-panel">
        <div class="card">
            <div class="card-title">📜 LANDASAN HUKUM & PASAL DAKWAAN</div>
            <div class="pasal-box">
                <strong id="pasal-title" style="color: #c5a059; font-size: 1.1rem;">-</strong>
                <p id="pasal-text" style="font-style: italic; margin-top: 8px; line-height: 1.4;">-</p>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('panel-sidang', this)">
            <span>⚖️</span>
            <span>Sidang</span>
        </button>
        <button class="nav-btn" onclick="switchTab('panel-bukti', this)">
            <span>🔍</span>
            <span>Alat Bukti</span>
        </button>
        <button class="nav-btn" onclick="switchTab('panel-uu', this)">
            <span>📜</span>
            <span>UU / Pasal</span>
        </button>
    </nav>

    <!-- MODAL POPUP KORAN (PENILAIAN UMUM/PUBLIK) -->
    <div id="news-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content news-paper">
            <div class="newspaper-header">
                <span>EDISI KHUSUS PERSIDANGAN</span>
                <span class="close-modal" onclick="closeNewsModal()">&times;</span>
            </div>
            <h2 id="news-headline" class="newspaper-title"></h2>
            <hr class="newspaper-hr">
            <p id="news-snippet" class="newspaper-body"></p>
            <div id="public-opinion" class="newspaper-opinion"></div>
            <button class="btn-close-paper" onclick="closeNewsModal()">TUTUP KORAN</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
